<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Todo List</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="scriptTodo.js" defer></script>
  </head>
  <body>
    <main class="todo-app">
      <header class="app-header">
        <h1 id="title">My Todo List</h1>
        <p class="subtitle">Organize your tasks and stay focus</p>
      </header>

      <section class="stats">
        <p id="taskCounter">Task: 0</p>
        <p id="completedCounter">Completed: 0</p>
      </section>

      <section class="task-control">
        <input
          id="taskInput"
          type="text"
          placeholder="Enter a task"
          autocomplete="off"
          autofocus
        />

        <select id="prioritySelect">
          <option value="low">🟢 Low</option>
          <option value="medium">🟡 Medium</option>
          <option value="high">🔴 High</option>
        </select>

        <button id="addTaskBtn" type="button">Add Task</button>
      </section>

      <section class="task-section">
        <div id="taskList" class="task-list"></div>
      </section>
    </main>
  </body>
</html>
